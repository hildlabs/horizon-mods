# Merging publishes: each new version's file becomes a release asset
# (<id>-<version>/<file>), then index.json, the icons and the screenshots go to GitHub
# Pages (https://horizon-rust.github.io/horizon-mods/index.json), which the launcher and
# playhorizon.dev/mods read. Nothing is published if any entry fails its checks.
# Every hour it runs again to refresh each project's `downloads` (GitHub's download
# counts of its release assets) and `stars` (its source repository's GitHub stars).
# Never compile submitted Rust or restore an Actions cache with publishing credentials.
# Native packages are source-only .hmod; the launcher uses the exact signed SDK.
name: publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  # The last successful publish run and its verified-files artifact.
  actions: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.pages-again.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The pin's checker: checker.yml's attested build, else built from source. No tool cache.
      - run: scripts/install-tool.sh
      # Files the last successful publish verified: GitHub counts every download of a release asset, so
      # fetching them all again each hour would count as players. Not an Actions cache (any job in main's
      # cache scope could write that, and it is unpacked before anything is hashed): an artifact only this
      # workflow uploads, taken only from a run this repository started on main (scripts/last-publish.sh; never a
      # pull request's), unpacked outside the checkout, and fetch.sh rehashes each file before use. Anything
      # missing (no earlier run, an expired artifact, a failed download) is the cold path: download it all.
      - name: The last successful publish
        id: last
        run: |
          run=$(scripts/last-publish.sh 2>/dev/null) || run=
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ -n "$run" ] || echo "no earlier successful publish: every file is downloaded"
      - if: steps.last.outputs.run != ''
        id: kept
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-files
          path: ${{ runner.temp }}/kept-files
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - name: Download the files
        env:
          FILES_KEPT: ${{ runner.temp }}/kept-files
        run: |
          [ "${{ steps.kept.outcome }}" = success ] || echo "no files kept from run ${{ steps.last.outputs.run }}: every file is downloaded"
          scripts/fetch.sh .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-files
          path: files/
          retention-days: 7
          if-no-files-found: error
      - name: Build the index
        run: |
          mkdir -p site
          cargo horizon-mod registry build . --files files --out site/index.json --site https://horizon-rust.github.io/horizon-mods/ --generated "$(date -u +%FT%TZ)"
      - name: Publish new files as releases
        run: |
          # One listing of the releases (the download counts read it too), not a request per version: every
          # request counts against the repository's hourly API budget, which every check and staging run shares.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > releases.json
          jq -r '.[].tag_name' releases.json > tags.txt
          cargo horizon-mod registry list . | while read -r sha id version file; do
            tag="$id-$version"
            grep -Fxq "$tag" tags.txt && continue
            dir="$(mktemp -d)"
            cp "files/$sha" "$dir/$file"
            gh release create "$tag" "$dir/$file" --title "$id $version" --latest=false \
              --notes "Reviewed in the registry: mods/$id.toml. SHA-256 $sha."
          done
      - name: Download counts
        run: |
          # A project's downloads are its files' counts, every version together: every release this
          # workflow made for it (tag `<id>-<version>`, title `<id> <version>`), so versions that left the
          # entry still count. A pack archived with an old API and brought back keeps the downloads of its
          # archived versions, which are still its own: the id is reserved for its owners. A release made
          # by this run isn't in the listing and has no downloads yet.
          # `--paginate` writes one array a page: -s and add join them.
          jq -s 'add | [.[] | (.name // "" | split(" ")) as $p
                | select(($p | length) == 2 and .tag_name == "\($p[0])-\($p[1])")
                | {key: $p[0], value: ([.assets[].download_count] | add // 0)}]
              | group_by(.key) | map({key: .[0].key, value: (map(.value) | add)}) | from_entries' \
            releases.json > counts.json
          jq --slurpfile counts counts.json '
            .projects |= map(
              ($counts[0][.id] // 0) as $n
              | if $n > 0 then .downloads = $n else . end)' site/index.json > index.counted.json
          mv index.counted.json site/index.json
          jq -r '.projects[] | "\(.id) \(.downloads // 0)"' site/index.json
      - name: GitHub stars
        run: |
          # A project's stars are its source repository's (owner/repo of a
          # https://github.com/ source, a folder of it or .git included), asked
          # once per repository. One that can't be read is left out, not zero.
          # That is a request per repository, so only the hourly run asks; any
          # other run takes each repository's stars from the published index.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            jq -r '.projects[].source // empty' site/index.json \
              | sed -nE 's#^https://github\.com/([A-Za-z0-9-]+)/([A-Za-z0-9._-]+).*#\1/\2#p' \
              | sed -E 's/\.git$//' | tr 'A-Z' 'a-z' | sort -u \
              | while read -r repo; do
                  n="$(gh api "repos/$repo" --jq .stargazers_count 2>/dev/null)" || continue
                  echo "{\"key\": \"$repo\", \"value\": $n}"
                done | jq -s from_entries > stars.json
          else
            (set -o pipefail
             curl -fsS https://horizon-rust.github.io/horizon-mods/index.json | jq '
               [.projects[] | select(.stars)
                 | {key: (first((.source // "") | ascii_downcase
                     | capture("^https://github[.]com/(?<r>[a-z0-9-]+/[a-z0-9._-]+)").r
                     | sub("[.]git$"; "")) // ""), value: .stars}
                 | select(.key != "")] | from_entries') > stars.json \
              || echo '{}' > stars.json
          fi
          jq --slurpfile stars stars.json '
            .projects |= map(
              (first((.source // "") | ascii_downcase
                | capture("^https://github[.]com/(?<r>[a-z0-9-]+/[a-z0-9._-]+)").r
                | sub("[.]git$"; "")) // "") as $r
              | ($stars[0][$r] // 0) as $n
              | if $n > 0 then .stars = $n else . end)' site/index.json > index.starred.json
          mv index.starred.json site/index.json
          jq -r '.projects[] | "\(.id) \(.stars // 0)"' site/index.json
      - name: The site
        run: |
          cp -R icons site/icons
          # Screenshots are served beside the icons: the index lists them at
          # <site>screenshots/<id>/<name>.
          if [ -d screenshots ]; then cp -R screenshots site/screenshots; fi
          python3 scripts/catalogue.py history . HEAD site/archive/native-v1
          python3 scripts/catalogue.py history . HEAD site/archive/api-0.1 --archive api-0.1
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Horizon mods</title>
          <meta http-equiv="refresh" content="0; url=https://playhorizon.dev/mods">
          <p><a href="https://playhorizon.dev/mods">playhorizon.dev/mods</a> · <a href="index.json">index.json</a> · <a href="archive/native-v1/">Incompatible native-v1 history</a> · <a href="archive/api-0.1/">Incompatible API 0.1 history</a></p>
          HTML
      # upload-pages-artifact follows links, so a submitted link (an icon, a screenshot) could publish the
      # runner's own files: only regular files and folders go to Pages.
      - name: Only regular files are published
        run: |
          bad=$(find mods icons site $( [ -d screenshots ] && echo screenshots ) ! -type f ! -type d)
          if [ -n "$bad" ]; then
            echo "::error::only regular files are published, not: $bad"
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      # GitHub sometimes doesn't list the artifact just uploaded yet ("No artifacts named github-pages") or answers
      # with a 5xx. Re-running the job can't recover, since it uploads a second github-pages artifact, so wait and
      # deploy once more here.
      - id: pages
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - if: steps.pages.outcome == 'failure'
        run: sleep 60
      - id: pages-again
        if: steps.pages.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
